<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hoist</title><link rel="stylesheet" href="style.css"></head><body>
<header><img src="icon.svg" alt="" width="38" height="38"><div><h1>Hoist</h1><small>SMALL APP. BIG SCREEN.</small></div></header>
<label for="devices">YOUR SCREEN</label><div class="row"><select id="devices"><option value="">Choose a screen</option></select><button id="refresh" class="quiet" title="Refresh devices">↻</button></div>
<label for="url">SEND TO SCREEN</label><input id="url" placeholder="YouTube or direct media URL" type="url"><button id="cast">Cast video</button>
<div class="controls"><button id="pause" class="quiet">Pause</button><button id="resume" class="quiet">Resume</button><button id="stop" class="quiet">Stop</button></div>
<hr><button id="enable" class="quiet">Enable native Cast buttons on this site</button><p class="hint">Experimental. Site support varies. Reload the page after enabling.</p>
<p id="status" role="status">Open Hoist on your Mac to connect.</p><footer>Preview 0.2 · <a href="https://github.com/TheOneWhoBurns/hoist/blob/main/extension/README.md" target="_blank" rel="noopener">Setup & compatibility</a></footer>
<script src="popup.js"></script></body></html>
